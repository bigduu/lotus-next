name: Frontend checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: frontend-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node:
          - 22
          - 24

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify architecture, behavior, build, and package contents
        run: npm run verify

      - name: Verify the deterministic provider fixture
        run: python3 e2e/support/realBambooProvider.py --self-test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify the all-surface browser contract
        run: npm run test:e2e:built

      - name: Upload browser evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report-node-${{ matrix.node }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: error
          retention-days: 14
