name: Frontend checks

on:
  pull_request:
    branches: [dev]

permissions:
  contents: read

env:
  FEATURE_WORKFLOW_SHA: ${{ github.workflow_sha }}

concurrency:
  group: frontend-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Feature Source
    runs-on: ubuntu-latest
    outputs:
      tested_snapshot: ${{ steps.source.outputs.tested_snapshot }}
      tested_tree: ${{ steps.source.outputs.tested_tree }}
    steps:
      - name: Check out the actual PR merge snapshot
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Set up source verification Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Bind the exact feature base, head, snapshot and tree
        id: source
        env:
          FEATURE_RECEIPT_PATH: ${{ runner.temp }}/feature-source.json
        run: node scripts/feature-acceptance.mjs source

      - name: Preserve the run-bound feature source
        uses: actions/upload-artifact@v5
        with:
          name: feature-source
          overwrite: true
          path: ${{ runner.temp }}/feature-source.json
          if-no-files-found: error
          retention-days: 30

  verify:
    name: Node ${{ matrix.node }}
    needs: source
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node:
          - 22
          - 24

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify Node 22 Unit compatibility
        if: matrix.node == 22
        run: npm run test:run

      - name: Verify architecture, build, and package contents
        if: matrix.node == 24
        run: npm run verify:artifact

      - name: Verify the deterministic provider fixture
        if: matrix.node == 24
        run: python3 e2e/support/realBambooProvider.py --self-test

      - name: Verify the complete four-shard browser inventory
        if: matrix.node == 24
        run: node scripts/browser-shards.mjs inventory

      - name: Share the verified exact-source artifact and inventory
        if: matrix.node == 24
        uses: actions/upload-artifact@v5
        with:
          name: browser-input-node-${{ matrix.node }}
          overwrite: true
          path: |
            dist/
            browser-inventory.json
          if-no-files-found: error
          retention-days: 14

  browser:
    name: Browser / Node ${{ matrix.node }} / shard ${{ matrix.shard }} of 4
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node:
          - 24
        shard:
          - 1
          - 2
          - 3
          - 4
    env:
      BROWSER_SHARD: ${{ matrix.shard }}

    steps:
      - name: Check out exact source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Restore the verified artifact and inventory for this Node lane
        uses: actions/download-artifact@v5
        with:
          name: browser-input-node-${{ matrix.node }}

      - name: Check exact artifact source and inventory
        run: node scripts/browser-shards.mjs check-source

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify the all-surface browser shard
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: browser-results.json
        run: npm run test:e2e:built -- --shard=${{ matrix.shard }}/4 --reporter=line,html,json

      - name: Verify controlled Project Work component fixtures
        if: ${{ matrix.shard == 1 }}
        run: node node_modules/@playwright/test/cli.js test --config=playwright.planning-controls.config.ts

      - name: Verify Sprint planning and fixed-snapshot browser contracts
        if: ${{ matrix.shard == 1 }}
        env:
          LOTUS_SPRINT_REVIEW_DIR: ${{ github.workspace }}/test-results/sprints
        run: node node_modules/@playwright/test/cli.js test --config=playwright.sprints.config.ts

      - name: Verify configuration sharing with the synthetic source harness
        if: ${{ matrix.shard == 1 }}
        run: npx playwright test --config=playwright.config-share.config.ts

      - name: Record this shard's actual outcome and inventory
        if: ${{ always() }}
        env:
          SHARD_STATUS: ${{ job.status }}
        run: node scripts/browser-shards.mjs receipt

      - name: Upload the independent shard receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@v5
        with:
          name: browser-receipt-node-${{ matrix.node }}-shard-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: browser-shard.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload browser evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report-node-${{ matrix.node }}-shard-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
            browser-results.json
          if-no-files-found: error
          retention-days: 14

  browser-summary:
    name: Browser acceptance
    if: ${{ always() }}
    needs: [verify, browser]
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Collect independent shard receipts across attempts
        uses: actions/download-artifact@v5
        with:
          pattern: browser-receipt-*
          path: browser-receipts

      - name: Require all Node lanes, shards, and original browser cases
        if: ${{ always() }}
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: node scripts/browser-shards.mjs summarize

      - name: Upload the complete browser summary
        uses: actions/upload-artifact@v5
        with:
          name: browser-summary-attempt-${{ github.run_attempt }}
          path: browser-summary.json
          if-no-files-found: error
          retention-days: 14

  real-bamboo-package:
    name: Prepare real Bamboo test package
    needs: [source, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      producer_attempt: ${{ steps.attempt.outputs.value }}
    steps:
      - name: Check out the actual PR merge snapshot
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Refuse another test package after an earlier pack started
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/feature-bamboo-package.mjs guard

      - name: Install dependencies
        run: npm ci

      - name: Restore the verified Node 24 artifact and inventory
        uses: actions/download-artifact@v5
        with:
          name: browser-input-node-24

      - name: Check the exact artifact source and inventory
        run: node scripts/browser-shards.mjs check-source

      - name: Restore the original feature source receipt
        uses: actions/download-artifact@v5
        with:
          name: feature-source
          path: ${{ runner.temp }}/accepted-feature-source

      - name: Pack the exact-source test artifact
        env:
          FEATURE_RECEIPT_PATH: ${{ runner.temp }}/accepted-feature-source/feature-source.json
        run: node scripts/feature-bamboo-package.mjs prepare "${RUNNER_TEMP}/feature-bamboo-package"

      - name: Record the physical producer attempt
        id: attempt
        run: echo "value=${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Upload the original test package
        id: upload
        uses: actions/upload-artifact@v5
        with:
          name: real-bamboo-test-package
          path: ${{ runner.temp }}/feature-bamboo-package/
          if-no-files-found: error
          retention-days: 14

  real-bamboo:
    name: Real Bamboo / Node 24
    needs: [source, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      BAMBOO_E2E_REVISION: 4786b7db862cabbebce49e288da62b284ccf5b72
      BAMBOO_E2E_HOST_REVISION: 4786b7db862cabbebce49e288da62b284ccf5b72

    steps:
      - name: Check out Lotus Next
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Check out the paired Bamboo revision
        uses: actions/checkout@v7
        with:
          repository: bigduu/Bamboo-agent
          ref: ${{ env.BAMBOO_E2E_REVISION }}
          path: .e2e-bamboo
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Restore the verified Node 24 artifact and inventory
        uses: actions/download-artifact@v5
        with:
          name: browser-input-node-24

      - name: Check the exact artifact source and inventory
        run: node scripts/browser-shards.mjs check-source

      - name: Install pinned browser system dependencies
        run: npx playwright install-deps chromium

      - name: Install the Playwright video recorder
        run: npx playwright install ffmpeg

      - name: Prepare the fixed verification browser
        run: node scripts/verification-browser.mjs prepare "${GITHUB_WORKSPACE}" "${RUNNER_TEMP}/verification-browser"

      - name: Verify a real chat round trip with the pinned published Bamboo
        env:
          BAMBOO_E2E_SOURCE_DIR: ${{ github.workspace }}/.e2e-bamboo
          BAMBOO_E2E_HOST_SOURCE_DIR: ${{ github.workspace }}/.e2e-bamboo
        run: node node_modules/@playwright/test/cli.js test --config="${RUNNER_TEMP}/verification-browser/real-bamboo.config.mjs"

      - name: Upload the verification browser identity
        if: ${{ always() }}
        uses: actions/upload-artifact@v5
        with:
          name: real-bamboo-verification-browser-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verification-browser/browser-identity.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload real Bamboo browser evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report-real-bamboo-node-24-attempt-${{ github.run_attempt }}
          path: |
            playwright-report-real-bamboo/
            test-results-real-bamboo/
          if-no-files-found: error
          retention-days: 14

  real-bamboo-surface:
    name: Real Bamboo ${{ matrix.mode }} / Node 24
    needs: [source, verify, real-bamboo-package]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        mode:
          - local
          - remote
    permissions:
      actions: read
      contents: read
    env:
      BAMBOO_E2E_REVISION: 4786b7db862cabbebce49e288da62b284ccf5b72
      BAMBOO_E2E_HOST_REVISION: 4786b7db862cabbebce49e288da62b284ccf5b72
      FEATURE_PACKAGE_ARTIFACT_ID: ${{ needs.real-bamboo-package.outputs.artifact_id }}
      FEATURE_PACKAGE_ARTIFACT_DIGEST: ${{ needs.real-bamboo-package.outputs.artifact_digest }}
      FEATURE_PACKAGE_PRODUCER_ATTEMPT: ${{ needs.real-bamboo-package.outputs.producer_attempt }}

    steps:
      - name: Check out Lotus Next
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Check out the paired Bamboo revision
        uses: actions/checkout@v7
        with:
          repository: bigduu/Bamboo-agent
          ref: ${{ env.BAMBOO_E2E_REVISION }}
          path: .e2e-bamboo
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Restore the verified Node 24 artifact and inventory
        uses: actions/download-artifact@v5
        with:
          name: browser-input-node-24

      - name: Check the exact artifact source and inventory
        run: node scripts/browser-shards.mjs check-source

      - name: Restore the original feature source receipt
        uses: actions/download-artifact@v5
        with:
          name: feature-source
          path: ${{ runner.temp }}/accepted-feature-source

      - name: Verify and restore the original test package by ID
        env:
          GH_TOKEN: ${{ github.token }}
          FEATURE_RECEIPT_PATH: ${{ runner.temp }}/accepted-feature-source/feature-source.json
        run: node scripts/feature-bamboo-package.mjs retrieve "${RUNNER_TEMP}/feature-bamboo-package"

      - name: Install pinned browser system dependencies
        run: npx playwright install-deps chromium

      - name: Install the Playwright video recorder
        run: npx playwright install ffmpeg

      - name: Prepare the fixed verification browser
        run: node scripts/verification-browser.mjs prepare "${GITHUB_WORKSPACE}" "${RUNNER_TEMP}/verification-browser"

      - name: Verify the current source artifact on the selected browser surface
        env:
          FEATURE_RECEIPT_PATH: ${{ runner.temp }}/accepted-feature-source/feature-source.json
          BAMBOO_E2E_SOURCE_DIR: ${{ github.workspace }}/.e2e-bamboo
          BAMBOO_E2E_HOST_SOURCE_DIR: ${{ github.workspace }}/.e2e-bamboo
        run: node scripts/feature-bamboo-package.mjs surface ${{ matrix.mode }} "${RUNNER_TEMP}/feature-bamboo-package" "${RUNNER_TEMP}/verification-browser"

      - name: Upload the verification browser identity
        if: ${{ always() }}
        uses: actions/upload-artifact@v5
        with:
          name: real-bamboo-${{ matrix.mode }}-verification-browser-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verification-browser/browser-identity.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload real Bamboo browser evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report-real-bamboo-${{ matrix.mode }}-node-24-attempt-${{ github.run_attempt }}
          path: |
            playwright-report-real-bamboo-${{ matrix.mode }}/
            test-results-real-bamboo-${{ matrix.mode }}/
            test-results-real-bamboo/${{ matrix.mode }}/
          if-no-files-found: error
          retention-days: 14

  native-actor:
    name: Native Actor acceptance
    needs: [source, verify]
    uses: ./.github/workflows/actor-native.yml

  feature-acceptance:
    name: Feature acceptance
    if: ${{ always() }}
    needs: [source, verify, browser-summary, real-bamboo, real-bamboo-package, real-bamboo-surface, native-actor]
    runs-on: ubuntu-latest
    steps:
      - name: Check out the actual PR merge snapshot
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Set up acceptance verification Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Restore the original source receipt across attempts
        uses: actions/download-artifact@v5
        with:
          name: feature-source
          path: ${{ runner.temp }}/accepted-feature-source

      - name: Require every feature gate on the exact tested snapshot
        env:
          SOURCE_RESULT: ${{ needs.source.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          BROWSER_RESULT: ${{ needs.browser-summary.result }}
          REAL_BAMBOO_RESULT: ${{ needs.real-bamboo.result }}
          REAL_BAMBOO_PACKAGE_RESULT: ${{ needs.real-bamboo-package.result }}
          REAL_BAMBOO_SURFACE_RESULT: ${{ needs.real-bamboo-surface.result }}
          NATIVE_ACTOR_RESULT: ${{ needs.native-actor.result }}
          FEATURE_RECEIPT_PATH: ${{ runner.temp }}/accepted-feature-source/feature-source.json
          FEATURE_ACCEPTANCE_PATH: ${{ runner.temp }}/feature-acceptance.json
        run: node scripts/feature-acceptance.mjs summarize

      - name: Preserve complete feature acceptance
        uses: actions/upload-artifact@v5
        with:
          name: feature-acceptance
          overwrite: true
          path: ${{ runner.temp }}/feature-acceptance.json
          if-no-files-found: error
          retention-days: 30
