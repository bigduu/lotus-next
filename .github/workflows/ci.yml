# TEMPORARY #453 diagnostic. Restore the exact pre-diagnostic CI blob by a NEW
# commit before any fix PR: 2fdc99f0047355ff188241fe84c7a3235c451dc1.
# This manual run is never feature, source-admission, or release evidence.
name: Diagnostic only - packed local network observation

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: lotus-453-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: harness

jobs:
  packed-local-diagnostic:
    name: Diagnostic only / original packed local / Chrome 157
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/lotus-next/test/453-network-observation' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out the actual diagnostic harness H
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: harness
          persist-credentials: false

      - name: Check out the unchanged Bamboo 18 fixture source
        uses: actions/checkout@v7
        with:
          repository: bigduu/Bamboo-agent
          ref: d6325a732c7669f94962f604e4ce98966e374d73
          path: bamboo-source
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: harness/package-lock.json

      - name: Install locked diagnostic dependencies without lifecycle builds
        run: npm ci --ignore-scripts

      - name: Download the exact original artifact M with read-only authority
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api --method GET --allow-escape-sequences
          repos/bigduu/lotus-next/actions/artifacts/12674258055/zip
          > "$RUNNER_TEMP/lotus-453-original-browser-input.zip"

      - name: Install Linux browser libraries and video FFmpeg only
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/lotus-453-playwright
        run: |
          node node_modules/@playwright/test/cli.js install-deps chromium
          node node_modules/@playwright/test/cli.js install ffmpeg

      - name: Observe the original packed-local test without changing its gates
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/lotus-453-playwright
        run: >-
          node scripts/diagnose-packed-network.mjs
          "$RUNNER_TEMP/lotus-453-original-browser-input.zip"
          "$GITHUB_WORKSPACE/bamboo-source"
          "$RUNNER_TEMP/lotus-453-diagnostic"

      - name: Preserve diagnostic evidence for this attempt
        if: ${{ always() }}
        uses: actions/upload-artifact@v5
        with:
          name: diagnostic-only-lotus453-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/lotus-453-diagnostic/evidence/
            harness/test-results-real-bamboo/local/evidence/
          if-no-files-found: warn
          retention-days: 14
