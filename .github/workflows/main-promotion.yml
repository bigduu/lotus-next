name: Lotus Main admission

# Base-branch controls inspect the PR merge and published bytes as data only.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: lotus-main-admission-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  main-admission:
    name: Main Admission
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out only the trusted Main workflow controls
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Set up read-only Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify the published source and exact Main promotion
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/main-promotion.mjs
