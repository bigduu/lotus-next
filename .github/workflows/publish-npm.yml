name: Publish retained frontend artifact

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Exact unused npm version"
        required: true
        type: string
      expected_source_sha:
        description: "Exact accepted dev commit frozen at release/S"
        required: true
        type: string
      feature_pull_request:
        description: "Original normally merged feature PR"
        required: true
        type: string
      feature_run_id:
        description: "Original complete feature acceptance run"
        required: true
        type: string
      feature_run_attempt:
        description: "Accepted logical feature attempt (physical jobs stay original)"
        required: true
        type: string

run-name: Publish original @bigduu/lotus-next@${{ inputs.version }}

permissions:
  contents: read

concurrency:
  group: publish-lotus-next-${{ inputs.version }}
  cancel-in-progress: false

env:
  LOTUS_NEXT_RELEASE_VERSION: ${{ inputs.version }}
  EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
  FEATURE_PULL_REQUEST: ${{ inputs.feature_pull_request }}
  FEATURE_RUN_ID: ${{ inputs.feature_run_id }}
  FEATURE_RUN_ATTEMPT: ${{ inputs.feature_run_attempt }}

jobs:
  prepare:
    name: Reserve frozen npm release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    outputs:
      source_tree: ${{ steps.reserve.outputs.source_tree }}
    steps:
      - name: Check out the actual trusted controller C
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: controller
          persist-credentials: false
      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Reserve source and version
        id: reserve
        working-directory: controller
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-npm-lifecycle.mjs reserve

  build:
    name: Produce original npm archive
    needs: [prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    env:
      EXPECTED_SOURCE_TREE: ${{ needs.prepare.outputs.source_tree }}
      SOURCE_ROOT: ${{ github.workspace }}/source
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the actual trusted controller C
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: controller
          persist-credentials: false
      - name: Check out the separate frozen product S
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.expected_source_sha }}
          path: source
          persist-credentials: false
      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      # Select before either lock installation, version stamp, Vite or npm pack.
      - name: Select original npm build
        id: original
        working-directory: controller
        run: node scripts/release-npm-lifecycle.mjs select
      - name: Install locked controller and product dependencies
        if: steps.original.outputs.mode == 'build'
        working-directory: controller
        run: node scripts/release-npm-lifecycle.mjs install
      - name: Build final dist once
        if: steps.original.outputs.mode == 'build'
        working-directory: controller
        run: node scripts/release-npm-lifecycle.mjs build
      - name: Pack and statically verify once
        if: steps.original.outputs.mode == 'build'
        working-directory: controller
        run: node scripts/release-npm-lifecycle.mjs pack
      - name: Retain original npm archive
        if: steps.original.outputs.mode == 'build'
        uses: actions/upload-artifact@v7
        with:
          name: lotus-next-original-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lotus-npm-${{ github.run_id }}-${{ github.run_attempt }}-build/original.zip
          compression-level: 0
          if-no-files-found: error
          retention-days: 90
          overwrite: false
      - name: Restore original npm archive
        if: steps.original.outputs.mode == 'restore'
        working-directory: controller
        run: node scripts/release-npm-lifecycle.mjs restore

  finalize:
    name: Publish retained npm archive
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      id-token: write
    env:
      EXPECTED_SOURCE_TREE: ${{ needs.prepare.outputs.source_tree }}
    steps:
      - name: Check out the actual trusted controller C
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: controller
          persist-credentials: false
      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Publish original npm archive
        working-directory: controller
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/release-npm-lifecycle.mjs finalize
