name: Publish frontend artifact once

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Exact new SemVer to publish (for example, 2026.9.12)"
        required: true
        type: string
      source_ref:
        description: "Formal tag to claim before building (refs/tags/lotus-next-vVERSION); do not pre-create it"
        required: true
        type: string
      expected_source_sha:
        description: "Exact normally accepted Dev commit frozen at release/S"
        required: true
        type: string

      feature_pr:
        description: "Original normally merged Dev feature PR"
        required: true
        type: string
run-name: Publish @bigduu/lotus-next@${{ inputs.version }}

permissions:
  contents: read
  actions: read

concurrency:
  group: publish-lotus-next-${{ inputs.version }}
  cancel-in-progress: false

env:
  LOTUS_NEXT_RELEASE_VERSION: ${{ inputs.version }}
  LOTUS_NEXT_SOURCE_DIRTY: "false"
  LOTUS_NEXT_EXPECTED_SOURCE_DIRTY: "false"
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_FUND: "false"
  NPM_CONFIG_PROGRESS: "false"

jobs:
  preflight:
    name: Validate publication request
    if: github.ref == 'refs/heads/dev' && github.ref_protected
    permissions:
      contents: write
      actions: read
      pull-requests: read
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
      source_tree: ${{ steps.source.outputs.source_tree }}
      source_ref: ${{ steps.source.outputs.source_ref }}
      bamboo_sha: ${{ steps.source.outputs.bamboo_sha }}
      workflow_sha: ${{ steps.source.outputs.workflow_sha }}
      tag_object_sha: ${{ steps.source.outputs.tag_object_sha }}
      source_receipt_artifact_id: ${{ steps.receipt.outputs.artifact-id }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out exact publication control source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up current npm
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          scope: "@bigduu"
          package-manager-cache: false

      - name: Resolve the reviewed immutable release candidate
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          FEATURE_PR_INPUT: ${{ inputs.feature_pr }}
          SOURCE_REF_INPUT: ${{ inputs.source_ref }}
          EXPECTED_SOURCE_SHA_INPUT: ${{ inputs.expected_source_sha }}
          EXPECTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
          LOTUS_RELEASE_TAG_RULESET_ID: ${{ vars.LOTUS_RELEASE_TAG_RULESET_ID }}
          SOURCE_RECEIPT_PATH: ${{ runner.temp }}/release-source-receipt.json
        run: node scripts/release-source.mjs reserve

      - name: Validate version and clean controller source
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          node --input-type=module - <<'NODE'
          import { assertPackageVersion } from "./scripts/artifact-manifest.mjs"
          const version = assertPackageVersion(process.env.LOTUS_NEXT_RELEASE_VERSION)
          if (version === "0.0.0") throw new Error("The source placeholder cannot be published")
          NODE
          test "${GITHUB_REF}" = "refs/heads/dev"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Upload the run-bound release source receipt
        id: receipt
        uses: actions/upload-artifact@v7
        with:
          name: release-source-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-source-receipt.json
          if-no-files-found: error
          overwrite: false
          retention-days: 30

  build:
    name: Build and pack the final artifact once
    needs: [preflight]
    runs-on: ubuntu-latest
    outputs:
      filename: ${{ steps.pack.outputs.filename }}
      integrity: ${{ steps.pack.outputs.integrity }}
      shasum: ${{ steps.pack.outputs.shasum }}
    env:
      LOTUS_NEXT_SOURCE_REVISION: ${{ needs.preflight.outputs.source_sha }}
      LOTUS_NEXT_EXPECTED_SOURCE_REVISION: ${{ needs.preflight.outputs.source_sha }}
      PUBLICATION_WORKFLOW_SHA: ${{ needs.preflight.outputs.workflow_sha }}
      ACCEPTED_SOURCE_TREE: ${{ needs.preflight.outputs.source_tree }}
    steps:
      - name: Refuse another build on workflow retries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict"
          import { execFileSync } from "node:child_process"
          const env = process.env, attempt = Number(env.GITHUB_RUN_ATTEMPT), runId = Number(env.GITHUB_RUN_ID)
          assert.equal(env.GITHUB_REPOSITORY, "bigduu/lotus-next")
          assert.ok(Number.isSafeInteger(attempt) && attempt > 0 && Number.isSafeInteger(runId) && runId > 0)
          assert.match(env.GITHUB_SHA, /^[0-9a-f]{40}$/)
          for (let prior = 1; prior < attempt; prior++) {
            const result = JSON.parse(execFileSync("gh", ["api", `repos/${env.GITHUB_REPOSITORY}/actions/runs/${runId}/attempts/${prior}/jobs?per_page=100`], { encoding: "utf8", maxBuffer: 256 * 1024 }))
            assert.equal(result.total_count, result.jobs.length, "Incomplete prior jobs")
            const matches = result.jobs.filter(job => job.name === "Build and pack the final artifact once")
            assert.equal(matches.length, 1, "Missing or ambiguous prior build job")
            const [job] = matches
            for (const [key, value] of Object.entries({ run_id: runId, run_attempt: prior, head_sha: env.GITHUB_SHA, status: "completed" })) assert.equal(job[key], value)
            assert.ok(Array.isArray(job.steps), "Missing prior steps")
            if (job.conclusion === "skipped") {
              assert.equal(job.steps.length, 0, "Inconsistent skipped job")
              continue
            }
            for (const name of ["Build and verify the final package tree", "Pack once without another lifecycle build"]) {
              const steps = job.steps.filter(step => step.name === name)
              assert.equal(steps.length, 1, "Missing or ambiguous build/pack evidence")
              assert.equal(steps[0].status, "completed")
              assert.equal(steps[0].conclusion, "skipped", "Build/pack already started; reuse the original tarball")
            }
          }
          NODE

      - name: Check out exact source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          persist-credentials: false

      - name: Require frozen source under the protected Dev publication workflow
        run: |
          test "${GITHUB_REF}" = "refs/heads/dev"
          test "${GITHUB_SHA}" = "${PUBLICATION_WORKFLOW_SHA}"
          test "$(git rev-parse HEAD)" = "${LOTUS_NEXT_EXPECTED_SOURCE_REVISION}"
          test "$(git rev-parse "HEAD^{tree}")" = "${ACCEPTED_SOURCE_TREE}"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Set up publishing Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          scope: "@bigduu"
          package-manager-cache: false

      - name: Install exact dependencies
        run: npm ci --ignore-scripts

      - name: Apply and verify a new release identity
        run: |
          test -z "$(git status --porcelain --untracked-files=all)"
          node --input-type=module - <<'NODE'
          import { assertPackageVersion } from "./scripts/artifact-manifest.mjs"
          const version = assertPackageVersion(process.env.LOTUS_NEXT_RELEASE_VERSION)
          if (version === "0.0.0") throw new Error("The source placeholder cannot be published")
          NODE
          npm version "${LOTUS_NEXT_RELEASE_VERSION}" --no-git-tag-version --ignore-scripts
          VERSION="$(node -p "require('./package.json').version")"
          test "${VERSION}" != "0.0.0"
          test "${VERSION}" = "${LOTUS_NEXT_RELEASE_VERSION}"
          test "$(node -p "require('./package-lock.json').version")" = "${VERSION}"
          test "$(node -p "require('./package-lock.json').packages[''].version")" = "${VERSION}"
          git diff --exit-code -- . ':(exclude)package.json' ':(exclude)package-lock.json'
          test -z "$(git ls-files --others --exclude-standard)"
          git diff -- package.json package-lock.json > "${RUNNER_TEMP}/release-identity.patch"
          if npm view "@bigduu/lotus-next@${VERSION}" version \
            > "${RUNNER_TEMP}/npm-view.out" 2> "${RUNNER_TEMP}/npm-view.err"; then
            echo "::error::@bigduu/lotus-next@${VERSION} is already published."
            exit 1
          fi
          if ! grep -q "E404" "${RUNNER_TEMP}/npm-view.err"; then
            cat "${RUNNER_TEMP}/npm-view.err" >&2
            echo "::error::The registry did not prove that the requested version is vacant."
            exit 1
          fi

      - name: Build and verify the final package tree
        run: |
          VITE_APP_REVISION="${LOTUS_NEXT_EXPECTED_SOURCE_REVISION}" VITE_APP_VERSION="${LOTUS_NEXT_RELEASE_VERSION}" npm run build
          npm run artifact:verify
          git diff -- package.json package-lock.json | cmp - "${RUNNER_TEMP}/release-identity.patch"
          git diff --exit-code -- . ':(exclude)package.json' ':(exclude)package-lock.json'
          test -z "$(git ls-files --others --exclude-standard)"

      - name: Pack once without another lifecycle build
        id: pack
        run: |
          npm pack --ignore-scripts --json > "${RUNNER_TEMP}/pack.json"
          node scripts/verify-package.mjs --pack-json "${RUNNER_TEMP}/pack.json"
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from "node:fs"
          const [packed] = JSON.parse(readFileSync(process.env.RUNNER_TEMP + "/pack.json", "utf8"))
          if (!packed?.filename || !packed?.integrity || !packed?.shasum) {
            throw new Error("npm pack did not return one complete tarball identity")
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `filename=${packed.filename}\nintegrity=${packed.integrity}\nshasum=${packed.shasum}\n`)
          NODE

      - name: Verify the exact local tarball
        env:
          PACKED_FILENAME: ${{ steps.pack.outputs.filename }}
        run: |
          mkdir -p "${RUNNER_TEMP}/local-roundtrip"
          tar -xzf "${PACKED_FILENAME}" -C "${RUNNER_TEMP}/local-roundtrip"
          node scripts/artifact-manifest.mjs verify \
            --dist "${RUNNER_TEMP}/local-roundtrip/package/dist" \
            --expected-name "@bigduu/lotus-next" \
            --expected-version "${LOTUS_NEXT_RELEASE_VERSION}" \
            --expected-revision "${LOTUS_NEXT_EXPECTED_SOURCE_REVISION}" \
            --expected-dirty false

      - name: Stage the original tarball and pack identity together
        env:
          PACKED_FILENAME: ${{ steps.pack.outputs.filename }}
        run: |
          mkdir "${RUNNER_TEMP}/release-package"
          cp -- "${PACKED_FILENAME}" "${RUNNER_TEMP}/pack.json" "${RUNNER_TEMP}/release-package/"

      - name: Retain the original final tarball and pack identity
        uses: actions/upload-artifact@v7
        with:
          name: frontend-release-${{ github.run_id }}
          path: ${{ runner.temp }}/release-package
          if-no-files-found: error
          overwrite: false
          retention-days: 90

  publish:
    name: Publish the retained tarball and verify the registry
    if: github.ref == 'refs/heads/dev' && github.ref_protected
    needs: [preflight, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
      id-token: write
    env:
      LOTUS_NEXT_EXPECTED_SOURCE_REVISION: ${{ needs.preflight.outputs.source_sha }}
    steps:
      - name: Check out only the original publication controls
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.workflow_sha }}
          persist-credentials: false
      - name: Set up publishing Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          scope: "@bigduu"
          package-manager-cache: false
      - name: Download the original final tarball
        uses: actions/download-artifact@v8
        with:
          name: frontend-release-${{ github.run_id }}
          path: ${{ runner.temp }}/release-package
      - name: Download the run-bound release source receipt
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.preflight.outputs.source_receipt_artifact_id }}
          path: ${{ runner.temp }}/accepted-source
      - name: Verify retained bytes and original source identity
        env:
          ARCHIVE_FILENAME: ${{ needs.build.outputs.filename }}
          EXPECTED_SHASUM: ${{ needs.build.outputs.shasum }}
          EXPECTED_INTEGRITY: ${{ needs.build.outputs.integrity }}
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict"
          import { createHash } from "node:crypto"
          import { readFileSync, appendFileSync } from "node:fs"
          const records = JSON.parse(readFileSync(process.env.RUNNER_TEMP + "/release-package/pack.json"))
          assert.equal(records.length, 1)
          const [packed] = records
          assert.equal(packed.name, "@bigduu/lotus-next"); assert.equal(packed.version, process.env.LOTUS_NEXT_RELEASE_VERSION)
          assert.equal(packed.filename, `bigduu-lotus-next-${process.env.LOTUS_NEXT_RELEASE_VERSION}.tgz`)
          assert.equal(packed.filename, process.env.ARCHIVE_FILENAME)
          const filename = process.env.RUNNER_TEMP + "/release-package/" + packed.filename
          const bytes = readFileSync(filename)
          appendFileSync(process.env.GITHUB_ENV, `PACKED_FILENAME=${filename}\n`)
          assert.equal(createHash("sha1").update(bytes).digest("hex"), process.env.EXPECTED_SHASUM)
          assert.equal(`sha512-${createHash("sha512").update(bytes).digest("base64")}`, process.env.EXPECTED_INTEGRITY)
          assert.equal(packed.shasum, process.env.EXPECTED_SHASUM); assert.equal(packed.integrity, process.env.EXPECTED_INTEGRITY)
          const source = JSON.parse(readFileSync(process.env.RUNNER_TEMP + "/accepted-source/release-source-receipt.json"))
          for (const [key, value] of Object.entries({ sourceSha: process.env.LOTUS_NEXT_EXPECTED_SOURCE_REVISION,
            version: process.env.LOTUS_NEXT_RELEASE_VERSION, workflowSha: process.env.GITHUB_SHA, runId: process.env.GITHUB_RUN_ID })) assert.equal(source[key], value)
          assert.ok(Number(source.runAttempt) > 0 && Number(source.runAttempt) <= Number(process.env.GITHUB_RUN_ATTEMPT))
          NODE
      - name: Verify the exact local tarball
        run: |
          mkdir -p "${RUNNER_TEMP}/local-roundtrip"
          tar -xzf "${PACKED_FILENAME}" -C "${RUNNER_TEMP}/local-roundtrip"
          node scripts/artifact-manifest.mjs verify \
            --dist "${RUNNER_TEMP}/local-roundtrip/package/dist" \
            --expected-name "@bigduu/lotus-next" \
            --expected-version "${LOTUS_NEXT_RELEASE_VERSION}" \
            --expected-revision "${LOTUS_NEXT_EXPECTED_SOURCE_REVISION}" \
            --expected-dirty false

      - name: Refresh the accepted Dev source immediately before publication
        env:
          GH_TOKEN: ${{ github.token }}
          FEATURE_PR_INPUT: ${{ inputs.feature_pr }}
          SOURCE_REF_INPUT: ${{ inputs.source_ref }}
          EXPECTED_SOURCE_SHA_INPUT: ${{ inputs.expected_source_sha }}
          EXPECTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
          LOTUS_RELEASE_TAG_RULESET_ID: ${{ vars.LOTUS_RELEASE_TAG_RULESET_ID }}
          SOURCE_RECEIPT_PATH: ${{ runner.temp }}/fresh-release-source-receipt.json
        run: node scripts/release-source.mjs

      - name: Recheck the immutable source tag before publication
        env:
          ACCEPTED_SOURCE_REF: ${{ needs.preflight.outputs.source_ref }}
          ACCEPTED_TAG_OBJECT_SHA: ${{ needs.preflight.outputs.tag_object_sha }}
        run: |
          git ls-remote --exit-code origin "${ACCEPTED_SOURCE_REF}" "${ACCEPTED_SOURCE_REF}^{}" > "${RUNNER_TEMP}/source-tag.txt"
          test "$(awk -v ref="${ACCEPTED_SOURCE_REF}" '$2 == ref { print $1 }' "${RUNNER_TEMP}/source-tag.txt")" = "${ACCEPTED_TAG_OBJECT_SHA}"
          test "$(awk -v ref="${ACCEPTED_SOURCE_REF}^{}" '$2 == ref { print $1 }' "${RUNNER_TEMP}/source-tag.txt")" = "${LOTUS_NEXT_EXPECTED_SOURCE_REVISION}"

      - name: Publish the exact verified tarball with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if npm view "@bigduu/lotus-next@${LOTUS_NEXT_RELEASE_VERSION}" dist --json > "${RUNNER_TEMP}/existing-version.json" 2> "${RUNNER_TEMP}/publish-vacancy.err"; then
            echo "Verify the existing version against the original tarball below."
          else
            grep -q E404 "${RUNNER_TEMP}/publish-vacancy.err"
            test -n "${NODE_AUTH_TOKEN}"
            npm publish "${PACKED_FILENAME}" --ignore-scripts --provenance --access public
          fi

      - name: Wait for the immutable registry version
        run: node scripts/wait-for-registry-version.mjs "@bigduu/lotus-next" "${LOTUS_NEXT_RELEASE_VERSION}"

      - name: Download and verify the registry copy
        env:
          LOCAL_TARBALL: ${{ env.PACKED_FILENAME }}
          EXPECTED_INTEGRITY: ${{ needs.build.outputs.integrity }}
          EXPECTED_SHASUM: ${{ needs.build.outputs.shasum }}
        run: |
          REGISTRY_TARBALL=""
          READBACK_DEADLINE=$((SECONDS + 600))
          test ! -e "${RUNNER_TEMP}/registry-dist.json"
          mkdir -p "${RUNNER_TEMP}/registry-roundtrip"
          # Publication happened once above. Only this exact public version's
          # ETARGET propagation response may retry; every attempt owns new bytes
          # and cache. Authentication, network, integrity and provenance errors
          # retain their original failure behavior.
          for READBACK_ATTEMPT in {1..121}; do
            REGISTRY_CACHE="${RUNNER_TEMP}/registry-roundtrip-cache-${READBACK_ATTEMPT}"
            READBACK_DIR="${RUNNER_TEMP}/registry-readback-${READBACK_ATTEMPT}"
            test ! -e "${REGISTRY_CACHE}"
            test ! -e "${READBACK_DIR}"
            mkdir "${READBACK_DIR}"
            if npm pack "@bigduu/lotus-next@${LOTUS_NEXT_RELEASE_VERSION}" --ignore-scripts --prefer-online --cache="${REGISTRY_CACHE}" --registry=https://registry.npmjs.org/ --pack-destination "${READBACK_DIR}" > "${READBACK_DIR}/pack.out" 2> "${READBACK_DIR}/npm.err" &&
               npm view "@bigduu/lotus-next@${LOTUS_NEXT_RELEASE_VERSION}" dist --json --prefer-online --cache="${REGISTRY_CACHE}" --registry=https://registry.npmjs.org/ > "${READBACK_DIR}/dist.json" 2> "${READBACK_DIR}/npm.err"; then
              cat "${READBACK_DIR}/pack.out"
              cat "${READBACK_DIR}/npm.err" >&2
              REGISTRY_TARBALL="$(find "${READBACK_DIR}" -maxdepth 1 -type f -name '*.tgz' -print -quit)"
              cp "${READBACK_DIR}/dist.json" "${RUNNER_TEMP}/registry-dist.json"
              break
            fi
            cat "${READBACK_DIR}/pack.out"
            cat "${READBACK_DIR}/npm.err" >&2
            node --input-type=module - "${READBACK_DIR}/npm.err" "${LOTUS_NEXT_RELEASE_VERSION}" <<'NODE'
          import assert from "node:assert/strict"
          import { readFileSync } from "node:fs"
          import { stripVTControlCharacters } from "node:util"
          const [errorPath, version] = process.argv.slice(2)
          const error = stripVTControlCharacters(readFileSync(errorPath, "utf8"))
          const codes = [...error.matchAll(/^npm (?:error|ERR!) code (\S+)\s*$/gm)].map((match) => match[1])
          assert.ok(codes.length && codes.every((code) => code === "ETARGET"), "Registry readback failed outside ETARGET propagation")
          assert.ok(error.includes(`No matching version found for @bigduu/lotus-next@${version}.`), "Registry error identifies another version")
          NODE
            if [ "${READBACK_ATTEMPT}" -ge 121 ] || [ "${SECONDS}" -ge "${READBACK_DEADLINE}" ]; then
              echo "::error::The exact registry version stayed unavailable within the bounded readback window."
              exit 1
            fi
            sleep 5
          done
          test -n "${REGISTRY_TARBALL}"
          export REGISTRY_TARBALL
          node --input-type=module - <<'NODE'
          import { createHash } from "node:crypto"
          import { readFileSync } from "node:fs"

          const digest = (algorithm, file, encoding) =>
            createHash(algorithm).update(readFileSync(file)).digest(encoding)
          const localSha1 = digest("sha1", process.env.LOCAL_TARBALL, "hex")
          const registrySha1 = digest("sha1", process.env.REGISTRY_TARBALL, "hex")
          const localIntegrity = `sha512-${digest("sha512", process.env.LOCAL_TARBALL, "base64")}`
          const registryIntegrity = `sha512-${digest("sha512", process.env.REGISTRY_TARBALL, "base64")}`
          const dist = JSON.parse(readFileSync(process.env.RUNNER_TEMP + "/registry-dist.json", "utf8"))

          if (localSha1 !== process.env.EXPECTED_SHASUM || registrySha1 !== localSha1) {
            throw new Error("The registry tarball SHA-1 does not match the verified local tarball")
          }
          if (localIntegrity !== process.env.EXPECTED_INTEGRITY || registryIntegrity !== localIntegrity) {
            throw new Error("The registry tarball integrity does not match the verified local tarball")
          }
          if (dist.shasum !== localSha1 || dist.integrity !== localIntegrity) {
            throw new Error("The registry metadata does not identify the verified tarball")
          }
          if (dist.attestations?.provenance?.predicateType !== "https://slsa.dev/provenance/v1") {
            throw new Error("The published package has no SLSA provenance attestation")
          }
          NODE
          tar -xzf "${REGISTRY_TARBALL}" -C "${RUNNER_TEMP}/registry-roundtrip"
          node scripts/artifact-manifest.mjs verify \
            --dist "${RUNNER_TEMP}/registry-roundtrip/package/dist" \
            --expected-name "@bigduu/lotus-next" \
            --expected-version "${LOTUS_NEXT_RELEASE_VERSION}" \
            --expected-revision "${LOTUS_NEXT_EXPECTED_SOURCE_REVISION}" \
            --expected-dirty false

      - name: Record immutable publication identity
        run: |
          MANIFEST_SHA256="$(sha256sum "${RUNNER_TEMP}/registry-roundtrip/package/dist/lotus-next-manifest.json" | cut -d ' ' -f 1)"
          {
            echo "### Published artifact"
            echo "- Package: \`@bigduu/lotus-next@${LOTUS_NEXT_RELEASE_VERSION}\`"
            echo "- Source: \`${LOTUS_NEXT_EXPECTED_SOURCE_REVISION}\`"
            echo "- Publication workflow: \`${GITHUB_SHA}\`"
            echo "- npm integrity: \`${{ needs.build.outputs.integrity }}\`"
            echo "- npm shasum: \`${{ needs.build.outputs.shasum }}\`"
            echo "- Universal manifest SHA-256: \`${MANIFEST_SHA256}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Record the verified publication source receipt
        env:
          EXPECTED_INTEGRITY: ${{ needs.build.outputs.integrity }}
          EXPECTED_SHASUM: ${{ needs.build.outputs.shasum }}
        run: |
          node --input-type=module - <<'NODE'
          import assert from "node:assert/strict"
          import { createHash } from "node:crypto"
          import { readFileSync, writeFileSync } from "node:fs"
          const root = process.env.RUNNER_TEMP
          const receipt = JSON.parse(readFileSync(root + "/accepted-source/release-source-receipt.json", "utf8"))
          assert.equal(receipt.workflowSha, process.env.GITHUB_SHA)
          assert.equal(receipt.runId, process.env.GITHUB_RUN_ID)
          assert.ok(Number(receipt.runAttempt) > 0 && Number(receipt.runAttempt) <= Number(process.env.GITHUB_RUN_ATTEMPT))
          assert.equal(receipt.sourceSha, process.env.LOTUS_NEXT_EXPECTED_SOURCE_REVISION)
          assert.equal(receipt.version, process.env.LOTUS_NEXT_RELEASE_VERSION)
          const bytes = readFileSync(root + "/registry-roundtrip/package/dist/lotus-next-manifest.json")
          const manifest = JSON.parse(bytes)
          assert.equal(manifest.sourceRevision, receipt.sourceSha)
          assert.equal(manifest.packageVersion, receipt.version)
          writeFileSync(root + "/publication-source-receipt.json", JSON.stringify({ ...receipt,
            npmIntegrity: process.env.EXPECTED_INTEGRITY, npmShasum: process.env.EXPECTED_SHASUM,
            manifestSha256: createHash("sha256").update(bytes).digest("hex"),
            resourcesSha256: manifest.resourcesSha256, sourceDirty: manifest.sourceDirty,
          }, null, 2) + "\n")
          NODE

      - name: Upload the verified publication source receipt
        uses: actions/upload-artifact@v7
        with:
          name: publication-source-receipt
          path: ${{ runner.temp }}/publication-source-receipt.json
          if-no-files-found: error
          retention-days: 30
